<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS3D - Dark Souls III 2D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #game-canvas { display: block; image-rendering: pixelated; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #ui-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 960px; height: 540px;
            pointer-events: none;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #ddd;
        }
        #ui-overlay .menu {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center;
        }
        #ui-overlay .menu-item {
            padding: 8px 32px; font-size: 22px; color: #888; cursor: default;
        }
        #ui-overlay .menu-item.selected {
            color: #e8c840; text-shadow: 0 0 12px rgba(232,200,64,0.6);
        }
        #ui-overlay .death-title {
            position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
            font-size: 36px; color: #c44; letter-spacing: 8px; text-shadow: 0 0 20px rgba(200,0,0,0.5);
        }
        #ui-overlay .hud-text {
            position: absolute; top: 28px; left: 230px; font-size: 13px; color: #aaa;
        }
        #ui-overlay .souls {
            position: absolute; top: 28px; left: 20px; font-size: 13px; color: #cc9;
            text-shadow: 0 0 4px rgba(200,180,100,0.3);
        }
        #ui-overlay .boss-name {
            position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
            font-size: 16px; color: #c8c; text-align: center;
            text-shadow: 0 0 8px rgba(200,100,200,0.4); letter-spacing: 2px;
        }
        #ui-overlay .level-up {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 32px; color: #e8c840; letter-spacing: 8px;
            text-shadow: 0 0 20px rgba(232,200,64,0.8);
        }
        #ui-overlay .controls {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            font-size: 12px; color: #555; text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas" width="960" height="540"></canvas>
    <div id="ui-overlay">
        <div class="menu" id="menu" style="display:none"></div>
        <div class="death-title" id="death-title" style="display:none">YOU DIED</div>
        <div class="hud-text" id="hud-text"></div>
        <div class="souls" id="souls-text"></div>
        <div class="boss-name" id="boss-name" style="display:none"></div>
        <div id="npc-dialogue" style="display:none;position:absolute;top:70%;left:50%;transform:translateX(-50%);font-size:16px;color:#eee;background:rgba(0,0,0,0.85);padding:12px 24px;border:1px solid #888;border-radius:4px;white-space:nowrap;pointer-events:none;font-family:'Segoe UI',Arial,sans-serif;"></div>
        <div class="level-up" id="level-up-text" style="display:none"></div>
        <canvas id="minimap-canvas" width="120" height="120" style="position:absolute;bottom:30px;right:10px;border:1px solid #333;background:rgba(0,0,0,0.7);image-rendering:pixelated;"></canvas>
        <div class="controls" id="controls">WASD移动 · 左键右手轻击 · 右键左手轻击 · Shift+左键右手重击 · Shift+右键左手重击/盾击 · 空格翻滚 · E交互 · R使用道具 · Q锁定 · F双持 · G表情 · ESC菜单 · ↑↓切换装备 · 手柄已支持</div>
        <div id="equip-slots" style="position:absolute;bottom:30px;left:30px;width:160px;height:130px;pointer-events:none;font-family:'Segoe UI',Arial,sans-serif;font-size:10px;color:#999;"></div>
    </div>
    <script type="module">
        const v = Date.now();
        const mod = await import('./pkg/ds2d.js?v=' + v);
        const { default: init, js_keydown, js_keyup, js_mouse_move, js_gamepad, js_debug_state, js_register_map } = mod;

        const MAP_PATHS = [
            'maps/ds2d/CemeteryOfAsh.ldtkl',
            'maps/ds2d/LothricWall.ldtkl',
            'maps/ds2d/UndeadSettlement.ldtkl',
            'maps/ds2d/CathedralDeep.ldtkl',
            'maps/ds2d/Irithyll.ldtkl',
            'maps/ds2d/RoadOfSacrifices.ldtkl',
            'maps/ds2d/FarronKeep.ldtkl',
            'maps/ds2d/CatacombsOfCarthus.ldtkl',
            'maps/ds2d/SmoulderingLake.ldtkl',
            'maps/ds2d/IrithyllDungeon.ldtkl',
            'maps/ds2d/ProfanedCapital.ldtkl',
            'maps/ds2d/AnorLondo.ldtkl',
            'maps/ds2d/LothricCastle.ldtkl',
            'maps/ds2d/GrandArchives.ldtkl',
            'maps/ds2d/KilnOfTheFirstFlame.ldtkl',
            'maps/ds2d/ConsumedKingsGarden.ldtkl',
            'maps/ds2d/UntendedGraves.ldtkl',
            'maps/ds2d/ArchdragonPeak.ldtkl',
        ];

        // --- Web Audio procedural SFX ---
        let audioCtx = null;

        function getAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function playTone(freq, duration, type, volume, pan) {
            const ctx = getAudio();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const panner = ctx.createStereoPanner();
            osc.type = type || 'square';
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.5, ctx.currentTime + duration);
            gain.gain.setValueAtTime(volume || 0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
            panner.pan.setValueAtTime(pan || 0, ctx.currentTime);
            osc.connect(gain);
            gain.connect(panner);
            panner.connect(ctx.destination);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + duration);
        }

        function playNoise(duration, volume) {
            const ctx = getAudio();
            const bufferSize = ctx.sampleRate * duration;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(volume || 0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
            source.connect(gain);
            gain.connect(ctx.destination);
            source.start(ctx.currentTime);
        }

        const sfxHandlers = {
            'attack':      () => { playTone(200, 0.15, 'sawtooth', 0.12); playNoise(0.08, 0.06); },
            'hit':         () => { playTone(120, 0.2, 'square', 0.15); playNoise(0.1, 0.1); },
            'player_hit':  () => { playTone(80, 0.3, 'sawtooth', 0.2); playTone(60, 0.4, 'square', 0.1); },
            'enemy_die':   () => { playTone(300, 0.1, 'square', 0.1); playTone(200, 0.2, 'sawtooth', 0.08); },
            'boss_die':    () => { playTone(100, 0.8, 'sawtooth', 0.25); playTone(50, 1.0, 'square', 0.15); playNoise(0.5, 0.15); },
            'roll':        () => { playNoise(0.15, 0.06); },
            'estus':       () => { playTone(400, 0.1, 'sine', 0.08); playTone(600, 0.15, 'sine', 0.06); playTone(800, 0.2, 'sine', 0.04); },
            'bonfire':     () => { playTone(300, 0.3, 'sine', 0.05); playTone(350, 0.3, 'sine', 0.04); },
            'souls':       () => { playTone(600, 0.1, 'sine', 0.06); playTone(900, 0.15, 'sine', 0.04); },
            'death':       () => { playTone(100, 1.0, 'sawtooth', 0.15); playTone(50, 1.5, 'square', 0.1); },
            'victory':     () => { playTone(400, 0.2, 'sine', 0.1); setTimeout(() => playTone(500, 0.2, 'sine', 0.1), 200); setTimeout(() => playTone(600, 0.4, 'sine', 0.12), 400); },
            'menu_select': () => { playTone(500, 0.05, 'square', 0.06); },
            'menu_confirm':() => { playTone(600, 0.08, 'square', 0.08); playTone(800, 0.1, 'square', 0.06); },
        };

        window.ds2d_play_sfx = function(sound_id, volume, pan) {
            const handler = sfxHandlers[sound_id];
            if (handler) handler();
        };

        // --- Procedural Combat Music ---
        let combatMusicActive = false;
        let combatMusicNodes = [];

        function startCombatMusic() {
            if (combatMusicActive) return;
            combatMusicActive = true;
            const ctx = getAudio();

            // Dark ambient drone
            const drone = ctx.createOscillator();
            drone.type = 'sawtooth';
            drone.frequency.setValueAtTime(55, ctx.currentTime);
            const droneGain = ctx.createGain();
            droneGain.gain.setValueAtTime(0.04, ctx.currentTime);
            drone.connect(droneGain);
            droneGain.connect(ctx.destination);
            drone.start();

            // Tension pulse (low bass hit)
            const pulse = ctx.createOscillator();
            pulse.type = 'square';
            pulse.frequency.setValueAtTime(40, ctx.currentTime);
            const pulseGain = ctx.createGain();
            pulseGain.gain.setValueAtTime(0.03, ctx.currentTime);
            pulse.connect(pulseGain);
            pulseGain.connect(ctx.destination);
            pulse.start();

            // Slow LFO on drone for movement
            const lfo = ctx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.setValueAtTime(0.3, ctx.currentTime);
            const lfoGain = ctx.createGain();
            lfoGain.gain.setValueAtTime(8, ctx.currentTime);
            lfo.connect(lfoGain);
            lfoGain.connect(drone.frequency);
            lfo.start();

            combatMusicNodes = [drone, pulse, lfo, droneGain, pulseGain, lfoGain];
        }

        function stopCombatMusic() {
            if (!combatMusicActive) return;
            combatMusicActive = false;
            const ctx = getAudio();
            for (const node of combatMusicNodes) {
                try {
                    if (node.stop) node.stop(ctx.currentTime + 0.5);
                    if (node.disconnect) node.disconnect();
                } catch(e) {}
            }
            combatMusicNodes = [];
        }

        window.ds2d_combat_music = function(active) {
            if (active) startCombatMusic();
            else stopCombatMusic();
        };

        const _loadedMaps = new Set();

        async function loadMap(path) {
            if (_loadedMaps.has(path)) return;
            const response = await fetch(path + '?v=' + v);
            if (!response.ok) throw new Error('Failed to load map ' + path + ': ' + response.status);
            const json = await response.text();
            js_register_map(path, json);
            _loadedMaps.add(path);
        }

        async function preloadMaps() {
            await Promise.all(MAP_PATHS.map(loadMap));
        }

        async function run() {
            await init({ module_or_path: './pkg/ds2d_bg.wasm?v=' + v });
            await preloadMaps();
            window.js_keydown = js_keydown;
            window.js_keyup = js_keyup;
            window.js_mouse_move = js_mouse_move;
            window.js_gamepad = js_gamepad;
            window.js_debug_state = js_debug_state;
            if (mod.js_teleport_to_area) window.js_teleport_to_area = mod.js_teleport_to_area;
            if (mod.js_set_player_pos) window.js_set_player_pos = mod.js_set_player_pos;
            // Gamepad polling loop (runs alongside Rust rAF)
            // Edge detection happens in JS — only rising edges are sent to Rust.
            let _gpPrev = new Array(16).fill(false);
            let _gpPrevLT = false, _gpPrevRT = false;
            (function pollGamepad() {
                requestAnimationFrame(pollGamepad);
                const gp = navigator.getGamepads ? navigator.getGamepads()[0] : null;
                if (!gp) {
                    if (window._gpActive) {
                        window._gpActive = false;
                        _gpPrev.fill(false); _gpPrevLT = false; _gpPrevRT = false;
                        js_gamepad(0,0,0,0, false,false,false,false, false,false,false,false, false,false,false,false, false,false,false,false, 0, false, false, false);
                    }
                    return;
                }
                window._gpActive = true;
                const dz = 0.15;
                const applyDz = v => Math.abs(v) < dz ? 0 : v;
                const btn = (i) => gp.buttons[i] ? gp.buttons[i].pressed : false;
                const trigVal = (i) => gp.buttons[i] ? gp.buttons[i].value : 0;

                // Edge-detect: bitmask of buttons that just transitioned to pressed
                let pressedMask = 0;
                for (let i = 0; i < 16; i++) {
                    const cur = btn(i);
                    if (cur && !_gpPrev[i]) pressedMask |= (1 << i);
                    _gpPrev[i] = cur;
                }

                // Trigger threshold crossings (0.5 threshold)
                const ltOver = trigVal(6) >= 0.5;
                const rtOver = trigVal(7) >= 0.5;
                const ltFired = ltOver && !_gpPrevLT;
                const rtFired = rtOver && !_gpPrevRT;
                _gpPrevLT = ltOver;
                _gpPrevRT = rtOver;

                js_gamepad(
                    applyDz(gp.axes[0] || 0), applyDz(gp.axes[1] || 0),
                    applyDz(gp.axes[2] || 0), applyDz(gp.axes[3] || 0),
                    btn(0), btn(1), btn(2), btn(3),
                    btn(4), btn(5), btn(6), btn(7),
                    btn(8), btn(9), btn(10), btn(11),
                    btn(12), btn(13), btn(14), btn(15),
                    pressedMask,
                    ltFired, rtFired,
                    true
                );
            })();
            // Init audio on first user interaction
            window.addEventListener('keydown', (e) => {
                e.preventDefault();
                if (!audioCtx) getAudio();
                js_keydown(e.key);
            }, { once: false });
            window.addEventListener('keyup', (e) => {
                e.preventDefault();
                js_keyup(e.key);
            });
            // Mouse: left click = light attack, right click = heavy attack
            const canvas = document.getElementById('game-canvas');
            canvas.addEventListener('mousedown', (e) => {
                e.preventDefault();
                if (!audioCtx) getAudio();
                if (e.button === 0) js_keydown('mouse_left');
                if (e.button === 2) js_keydown('mouse_right');
            });
            canvas.addEventListener('mouseup', (e) => {
                if (e.button === 0) js_keyup('mouse_left');
                if (e.button === 2) js_keyup('mouse_right');
            });
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());
            // Mouse move: track position for camera and lock-on
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = 960 / rect.width;
                const scaleY = 540 / rect.height;
                js_mouse_move(
                    (e.clientX - rect.left) * scaleX,
                    (e.clientY - rect.top) * scaleY
                );
            });
            // Mouse wheel: cycle lock-on target
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (e.deltaY < 0) { js_keydown('wheel_up'); js_keyup('wheel_up'); }
                if (e.deltaY > 0) { js_keydown('wheel_down'); js_keyup('wheel_down'); }
            });
        }
        run();
    </script>
</body>
</html>
