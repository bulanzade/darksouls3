[package]
name = "ds2d"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.120"
js-sys = "0.3.97"
log = "0.4"
console_error_panic_hook = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ldtk2 = "0.8.0"

[dependencies.web-sys]
version = "0.3.97"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlBuffer",
  "WebGlVertexArrayObject",
  "WebGlUniformLocation",
  "WebGlTexture",
  "WebGlFramebuffer",
  "KeyboardEvent",
  "EventTarget",
  "Performance",
  "CanvasRenderingContext2d",
]

[features]
default = ["debug_exports"]
debug_exports = []

[profile.release]
opt-level = "z"
lto = true
